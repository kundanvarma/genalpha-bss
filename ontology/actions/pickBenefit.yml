action: pickBenefit
version: 1
introduced: 2026-10-27
status: active
meaning: Pick a benefit with one of the household's Choices — an ordinary product order; the ledger holds the Choice and commits it once the benefit is active.
intent: A customer asks the care desk (or its assistant) for a benefit their plan already pays for; no price, no checkout — only a Choice.
concept: Subscription
inputs:
  - { name: customerId, type: ref, concept: Customer, required: true, meaning: the household whose Choice is spent }
  - { name: benefitOfferingId, type: ref, concept: ProductOffering, required: true, meaning: the benefit to pick }
  - { name: lineId, type: ref, concept: Service, required: false, meaning: "for a benefit picked once per line (#420): which of the household's lines it is for — ordering refuses a per-line pick without one, or with a line that is not the household's" }
preconditions:
  - id: benefit-on-sale
    check: state
    concept: ProductOffering
    of: benefitOfferingId
    in: [Active, Launched]
    says: the benefit must be on offer
permissions:
  anyOf:
    - { role: ordering:write }
policy: { domain: order, capability: policy.evaluate }
governance:
  # high: a pick spends no money and can be released; the ledger refuses one the
  # household has no Choice for, so the action cannot overspend
  autonomy: high
  approval: none
  audit: mandatory
executes:
  capability: productOrdering.create
  template:
    productOrderItem:
      - id: "1"
        action: add
        quantity: 1
        productOffering: { id: "${benefitOfferingId}" }
        product:
          productCharacteristic:
            - { name: lineServiceId, value: "${lineId}" }
    relatedParty:
      - { id: "${customerId}", role: customer }
effects:
  - { capability: ontology.receipt, when: executed }
emits:
  - { event: ProductOrderCreateEvent, component: product-ordering, meaning: the pick was placed }
  - { event: ChoiceHeldEvent, component: benefit-allowance, meaning: the Choice is held while the partner activates the benefit }
  - { event: ChoicePickedEvent, component: benefit-allowance, meaning: the benefit is active and the Choice in use }
  - { event: DecisionRecordedEvent, component: ontology }
outcome: { concept: ProductOrder, settles: ChoicePickedEvent }
pages: [csr:customers]
