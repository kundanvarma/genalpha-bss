# Typed capabilities: the verbs a component can execute. Actions execute through
# one, effects and preconditions reference them, the conformance suite (#125)
# proves every route is served by the gateway. Routes are relative to the
# component (the registry reaches the component directly, with the caller's
# own token; the gateway serves the same path to the outside).
capabilities:
  - id: party.individual
    version: 1
    component: party-account
    kind: tmf-api
    tmf: TMF632 Party Management
    meaning: Read one individual — the person behind a customer.
    route: { method: GET, path: "/tmf-api/partyManagement/v4/individual/{id}" }
    roles: [party:read]

  - id: productInventory.product
    version: 1
    component: product-inventory
    kind: tmf-api
    tmf: TMF637 Product Inventory
    meaning: Read one product instance — a customer's subscription as the inventory holds it.
    route: { method: GET, path: "/tmf-api/productInventory/v4/product/{id}" }
    roles: [inventory:read]

  - id: productInventory.products
    version: 1
    component: product-inventory
    kind: tmf-api
    tmf: TMF637 Product Inventory
    meaning: List a customer's products.
    route: { method: GET, path: "/tmf-api/productInventory/v4/product" }
    roles: [inventory:read]

  - id: serviceInventory.services
    version: 1
    component: service-orchestration
    kind: tmf-api
    tmf: TMF638 Service Inventory
    meaning: List the live services of a customer — the line itself, with its number.
    route: { method: GET, path: "/tmf-api/serviceInventory/v4/service" }
    roles: [service:read]

  - id: productCatalog.offering
    version: 1
    component: product-catalog
    kind: tmf-api
    tmf: TMF620 Product Catalog
    meaning: Read one product offering as the caller's sales channel sees it (X-Channel decides visibility).
    route: { method: GET, path: "/tmf-api/productCatalogManagement/v4/productOffering/{id}" }

  - id: productCatalog.offerings
    version: 1
    component: product-catalog
    kind: tmf-api
    tmf: TMF620 Product Catalog
    meaning: List the offerings on the shelf for the caller's channel.
    route: { method: GET, path: "/tmf-api/productCatalogManagement/v4/productOffering" }

  - id: productCatalog.price
    version: 1
    component: product-catalog
    kind: tmf-api
    tmf: TMF620 Product Catalog
    meaning: Read one price — an offering names its prices by reference; the monthly one is the recurring price.
    route: { method: GET, path: "/tmf-api/productCatalogManagement/v4/productOfferingPrice/{id}" }

  - id: productOrdering.create
    version: 1
    component: product-ordering
    kind: tmf-api
    tmf: TMF622 Product Ordering
    meaning: Place a product order — the only way a subscription is created or changed.
    route: { method: POST, path: "/tmf-api/productOrderingManagement/v4/productOrder" }
    roles: [ordering:write]

  - id: productOrdering.order
    version: 1
    component: product-ordering
    kind: tmf-api
    tmf: TMF622 Product Ordering
    meaning: Read one product order and its state.
    route: { method: GET, path: "/tmf-api/productOrderingManagement/v4/productOrder/{id}" }
    roles: [ordering:read]

  - id: productQualification.check
    version: 1
    component: qualification
    kind: tmf-api
    tmf: TMF679 Product Offering Qualification
    meaning: Ask whether an offering can be delivered at a place (serviceability by postcode).
    route: { method: POST, path: "/tmf-api/productOfferingQualification/v4/checkProductOfferingQualification" }

  - id: agreement.list
    version: 1
    component: agreement
    kind: tmf-api
    tmf: TMF651 Agreement Management
    meaning: List a customer's agreements — commitments that may bind a subscription to its offering.
    route: { method: GET, path: "/tmf-api/agreementManagement/v4/agreement" }
    roles: [agreement:read]

  - id: policy.evaluate
    version: 1
    component: policy
    kind: house-api
    tmf: TMF policy pattern (JSON-logic rules as data)
    meaning: Evaluate the enabled rules of a domain against a context; first matching deny wins.
    route: { method: POST, path: "/tmf-api/policyManagement/v4/evaluate" }
    roles: [policy:evaluate]

  - id: charging.changeRatePlan
    version: 1
    component: service-orchestration
    kind: seam
    seam: ocs
    meaning: Move the line to the rate plan of its new offering in the online charging system (SigScale, or the tenant's own OCS).

  - id: entitlement.changeOffering
    version: 1
    component: device-entitlement
    kind: tmf-api
    tmf: TMF-style Device Entitlement (GSMA TS.43 server)
    meaning: Tell the entitlement server the line's plan changed, so phones learn what they may use now.
    route: { method: PUT, path: "/tmf-api/deviceEntitlement/v1/subscriber" }
    roles: [entitlement:write]

  - id: billing.prorate
    version: 1
    component: billing
    kind: internal
    meaning: On the next bill run, split the month at the change date — the old plan until then, the new plan after.

  - id: billing.bills
    version: 1
    component: billing
    kind: tmf-api
    tmf: TMF678 Customer Bill
    meaning: List a customer's bills.
    route: { method: GET, path: "/tmf-api/customerBillManagement/v4/customerBill" }
    roles: [billing:read]

  - id: decisionLog.read
    version: 1
    component: insight
    kind: house-api
    meaning: Read decision receipts — what was chosen, by which policy, why, and what followed.
    route: { method: GET, path: "/insight/v1/decisions" }
    roles: [insight:read]

  - id: ontology.receipt
    version: 1
    component: ontology
    kind: internal
    meaning: Write a decision receipt for an executed action (DecisionRecordedEvent on bss.ontology.events, ingested by insight).

  - id: ontology.check
    version: 1
    component: ontology
    kind: house-api
    meaning: Answer whether an action may happen for these inputs, naming every condition and its verdict — without doing it.
    route: { method: POST, path: "/ontology/v1/actions/{name}/check" }

  - id: ontology.execute
    version: 1
    component: ontology
    kind: house-api
    meaning: Check, then execute an action through its capability with the caller's own rights, and write the receipt.
    route: { method: POST, path: "/ontology/v1/actions/{name}/execute" }

  - id: serviceInventory.service
    version: 1
    component: service-orchestration
    kind: tmf-api
    tmf: TMF638 Service Inventory
    meaning: Read one service — the line, with its state, number and restriction.
    route: { method: GET, path: "/tmf-api/serviceInventory/v4/service/{id}" }
    roles: [service:read]

  - id: service.suspend
    version: 1
    component: service-orchestration
    kind: house-api
    tmf: TMF638 Service Inventory (house verb)
    meaning: Pause a line — charging off, entitlements suspended, the number kept; open-ended or until a date within 90 days.
    route: { method: POST, path: "/tmf-api/serviceInventory/v4/service/{id}/suspend" }

  - id: service.resume
    version: 1
    component: service-orchestration
    kind: house-api
    tmf: TMF638 Service Inventory (house verb)
    meaning: Bring a paused line back — charging on, entitlements active.
    route: { method: POST, path: "/tmf-api/serviceInventory/v4/service/{id}/resume" }

  - id: service.replaceSim
    version: 1
    component: service-orchestration
    kind: house-api
    tmf: TMF638 Service Inventory (house verb)
    meaning: Block the old card at the network and issue a new one — the number stays; the entitlement server is rebound.
    route: { method: POST, path: "/tmf-api/serviceInventory/v4/service/{id}/sim/replace" }

  - id: charging.suspend
    version: 1
    component: service-orchestration
    kind: seam
    seam: ocs
    meaning: Switch charging off for the line in the online charging system.

  - id: charging.resume
    version: 1
    component: service-orchestration
    kind: seam
    seam: ocs
    meaning: Switch charging back on for the line in the online charging system.

  - id: entitlement.rebind
    version: 1
    component: device-entitlement
    kind: tmf-api
    tmf: TMF-style Device Entitlement (GSMA TS.43 server)
    meaning: Bind the line to its new SIM so the old card's tokens die and the new card is trusted.
    route: { method: PUT, path: /tmf-api/deviceEntitlement/v1/subscriber }
    roles: [entitlement:write]

  - id: productOrdering.cancel
    version: 1
    component: product-ordering
    kind: tmf-api
    tmf: TMF622 Product Ordering
    meaning: Cancel an order that has not completed — stock released, card authorisations voided.
    route: { method: PATCH, path: "/tmf-api/productOrderingManagement/v4/productOrder/{id}" }
    roles: [ordering:write]

  - id: ordering.releaseStock
    version: 1
    component: product-ordering
    kind: internal
    meaning: Release the stock reserved for the order.

  - id: ordering.voidPayments
    version: 1
    component: product-ordering
    kind: internal
    meaning: Void the card authorisations taken for the order.

  - id: billing.bill
    version: 1
    component: billing
    kind: tmf-api
    tmf: TMF678 Customer Bill
    meaning: Read one bill — its state, amount due and lines.
    route: { method: GET, path: "/tmf-api/customerBillManagement/v4/customerBill/{id}" }
    roles: [billing:read]

  - id: billing.dispute
    version: 1
    component: billing
    kind: house-api
    tmf: TMF678 Customer Bill (house verb)
    meaning: Open a dispute on a bill — collection never chases contested money while it is open.
    route: { method: POST, path: "/tmf-api/customerBillManagement/v4/customerBill/{id}/dispute" }
    roles: [billing:write]

  - id: billing.creditNote
    version: 1
    component: billing
    kind: house-api
    tmf: TMF678 Customer Bill (house verb)
    meaning: Issue a numbered credit note against a bill — reduces what is due, or refunds a settled bill through the PSP.
    route: { method: POST, path: "/tmf-api/customerBillManagement/v4/customerBill/{id}/creditNote" }
    roles: [billing:admin]

  - id: collections.pause
    version: 1
    component: billing
    kind: internal
    meaning: Hold the dunning ladder for the bill while its dispute is open.

  - id: billing.distributeCreditNote
    version: 1
    component: billing
    kind: internal
    meaning: Send the credit note to the customer on the same channel as the bill (PDF, EHF/Peppol).

  - id: catalog.governanceView
    version: 1
    component: product-catalog
    kind: house-api
    tmf: TMF620 Product Catalog (launch governance)
    meaning: Read an offering's launch state — requested, approved, held, launched — with its readiness and trail.
    route: { method: GET, path: "/tmf-api/productCatalogManagement/v4/productOffering/{id}/governance" }
    roles: [catalog:read]

  - id: catalog.requestLaunch
    version: 1
    component: product-catalog
    kind: house-api
    tmf: TMF620 Product Catalog (launch governance)
    meaning: Ask for a draft offering to be launched; inside a pre-approved envelope it is approved at once.
    route: { method: POST, path: "/tmf-api/productCatalogManagement/v4/productOffering/{id}/governance/request" }
    roles: [catalog:write]

  - id: catalog.approveLaunch
    version: 1
    component: product-catalog
    kind: house-api
    tmf: TMF620 Product Catalog (launch governance)
    meaning: Approve a requested launch — good for the tenant's expiry window; readiness still gates the launch itself.
    route: { method: POST, path: "/tmf-api/productCatalogManagement/v4/productOffering/{id}/governance/approve" }
    roles: [catalog:approve]

  - id: catalog.holdLaunch
    version: 1
    component: product-catalog
    kind: house-api
    tmf: TMF620 Product Catalog (launch governance)
    meaning: Pull the brake on a launch — dated (lifts by itself) or open-ended (until resumed).
    route: { method: POST, path: "/tmf-api/productCatalogManagement/v4/productOffering/{id}/governance/hold" }
    roles: [catalog:read]

  - id: governance.envelope
    version: 1
    component: product-catalog
    kind: internal
    meaning: Evaluate the launch envelopes (policy domain launch); a matching envelope pre-approves the request.

  - id: workforce.fileApproval
    version: 1
    component: intelligence
    kind: house-api
    meaning: File an action for a human approver, who executes it with their own token from AI & Automation › Workforce.
    route: { method: POST, path: /ai/v1/workforce/approvals }
    roles: [workforce:use]
