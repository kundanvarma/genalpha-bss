# THE TENANT FLEET AS A FILE — mounted read-only into every service at
# /config/tenants.yml (SPRING_CONFIG_IMPORT). Onboarding a new operator =
# append a block + restart the fleet. No rebuild. This is the UNION of
# every service's per-tenant fields: binding ignores fields a service
# does not know, and ${ENV:default} placeholders resolve per container
# (machine identities ride OIDC_CLIENT_ID/SECRET env set in compose).
bss:
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-assurance}
        machine-client-secret: ${OIDC_CLIENT_SECRET:assurance-secret}
        bill-distribution-provider: ${BILL_DISTRIBUTION_PROVIDER:none}
        bill-distribution-url: ${BILL_DISTRIBUTION_URL:}
        bill-distribution-token: ${BILL_DISTRIBUTION_TOKEN:}
        bill-distribution-format: ${BILL_DISTRIBUTION_FORMAT:peppol}
        bill-distribution-channel: ${BILL_DISTRIBUTION_CHANNEL:einvoice}
        bank-token: ${BANK_TOKEN:}
        social-api-url: ${SOCIAL_API_URL:}
        social-access-token: ${SOCIAL_ACCESS_TOKEN:}
        social-provider: ${SOCIAL_PROVIDER:mock}
        social-api-version: ${SOCIAL_API_VERSION:v21.0}
        social-account-id: ${SOCIAL_ACCOUNT_ID:}
        social-ig-user-id: ${SOCIAL_IG_USER_ID:}
        social-ads-token: ${SOCIAL_ADS_TOKEN:}
        delivery-provider: ${DELIVERY_PROVIDER:internal}
        esp-url: ${ESP_URL:}
        esp-api-key: ${ESP_API_KEY:}
        esp-from: ${ESP_FROM:}
        brand-name: MyGenAlpha
        brand-color: "#0E7C7B"
        locale: en
        currency: EUR
        timezone: Europe/Oslo
        # Show the B2B lead-capture on the consumer shop (this operator has a
        # business line). Off by default — an MVNO with no B2B never advertises one.
        desk-learning: ${DESK_LEARNING:true}
        business-sales: true
        # Agentic commerce exposure: off (dark to agents) | discovery
        # (findable, no agent checkout) | full. New tenants default OFF —
        # being shopped by AI agents is opt-in, never assumed.
        agent-commerce: ${AGENT_COMMERCE:full}
        # GEO: crawler visibility — open (all crawlers + llms.txt) |
        # search-only (classic search yes, AI answer/training bots no) |
        # dark (no crawlers). Newborn tenants default search-only.
        ai-visibility: ${AI_VISIBILITY:open}
        # The digital workforce's BRAIN — live config, no restart: change
        # any of these and the worker-controller ROLLS the workers onto
        # the new model/key (leases free themselves, so rolling is safe).
        worker-ai-provider: ${WORKER_AI_PROVIDER:anthropic}
        worker-ai-base-url: ${WORKER_AI_BASE_URL:}
        worker-ai-api-key: ${WORKER_AI_API_KEY:}
        worker-ai-model: ${WORKER_AI_MODEL:claude-haiku-4-5-20251001}
        # THE OVERLAY SEAMS: the legacy estate this tenant wraps (empty =
        # native mode, no legacy). Catalog federates read-through; orders
        # with legacy- items hand off to the legacy queue; the workforce
        # works the legacy incident backlog with verified completion.
        legacy-catalog-base-url: ${LEGACY_CATALOG_BASE_URL:}
        legacy-fulfilment-base-url: ${LEGACY_FULFILMENT_BASE_URL:}
        legacy-ticket-base-url: ${LEGACY_TICKET_BASE_URL:}
        hosts: [localhost, 127.0.0.1, shop.genalpha.localhost]
        analytics-provider: ${ANALYTICS_PROVIDER:internal}
        analytics-mp-url: ${ANALYTICS_MP_URL:https://www.google-analytics.com}
        analytics-measurement-id: ${ANALYTICS_MEASUREMENT_ID:}
        analytics-api-secret: ${ANALYTICS_API_SECRET:}
        analytics-data-url: ${ANALYTICS_DATA_URL:}
        analytics-property-id: ${ANALYTICS_PROPERTY_ID:}
        analytics-data-token: ${ANALYTICS_DATA_TOKEN:}
        pim-base-url: ${PIM_BASE_URL:}
        social-lead-form-id: ${SOCIAL_LEAD_FORM_ID:}
        dnc-url: ${DNC_URL:}
        dnc-token: ${DNC_TOKEN:}
        market-feed-url: ${MARKET_FEED_URL:}
        speech-url: ${SPEECH_URL:}
        speech-token: ${SPEECH_TOKEN:}
        market-feed-token: ${MARKET_FEED_TOKEN:}
        # the shared AI stack (tier fallback). Without these the router
        # short-circuits to the service default and IGNORES the tier keys.
        ai-provider: ${AI_PROVIDER:}
        ai-base-url: ${AI_BASE_URL:}
        ai-api-key: ${AI_API_KEY:}
        ai-model: ${AI_MODEL:}
        ai-model-fast: ${AI_MODEL_FAST:}
        ai-model-smart: ${AI_MODEL_SMART:}
        ai-provider-fast: ${AI_PROVIDER_FAST:}
        ai-base-url-fast: ${AI_BASE_URL_FAST:}
        ai-api-key-fast: ${AI_API_KEY_FAST:}
        ai-provider-smart: ${AI_PROVIDER_SMART:}
        ai-base-url-smart: ${AI_BASE_URL_SMART:}
        ai-api-key-smart: ${AI_API_KEY_SMART:}
        # T-P3: this tenant allows RAW-exposure AI use-cases (legacy copilots).
        # New tenants default OFF — raw is opt-in, never assumed.
        ai-raw-exposure: true
