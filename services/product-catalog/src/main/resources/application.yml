spring:
  # Jackson 3 arrived with Spring Boot 4 and flipped two defaults under us, both
  # visible on the wire: keys would come out alphabetically (@type first, then
  # a-z) on every TM Forum body, and a sparse payload that omits a primitive
  # would throw instead of reading as 0/false. Pinned back to what this
  # component's payloads and DTOs were written against.
  jackson:
    mapper:
      sort-properties-alphabetically: false
    deserialization:
      fail-on-null-for-primitives: false
  # Outbound HTTP has an end. The JDK client waits forever by default, so a
  # dependency that accepts the connection and then goes quiet holds a request
  # thread until something kills it.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
  application:
    name: product-catalog
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  events:
    topic: bss.catalog.events
  geo:
    # THE CRAWLER ROSTER, as configuration — "user-agent:group" per entry.
    # Which bots exist and what each one is FOR is each vendor's own fact and
    # it drifts: OpenAI separated GPTBot (training) from OAI-SearchBot
    # (retrieval), and that separation is the whole reason `ai-visibility:
    # search-ai` can exist. An operator corrects a rename with
    # BSS_GEO_CRAWLERS=... and waits for no release.
    #
    # ORDER IS LOAD-BEARING. `search-only` names every entry below, and a live
    # tenant is on it, so this list's order is the order its robots.txt has
    # always shipped in. Reordering or adding a name REWRITES that operator's
    # published posture — a decision, never a tidy-up.
    crawlers: >-
      GPTBot:training,
      OAI-SearchBot:retrieval,
      ClaudeBot:training,
      anthropic-ai:training,
      PerplexityBot:retrieval,
      Google-Extended:training,
      CCBot:training,
      Bytespider:training
  downstream:
    # the configurator consults policy: block rules (machine seam) and
    # the public deal engine's indicative price — both fail open
    policy-base-url: ${POLICY_BASE_URL:http://localhost:8113}
    # availability per configuration for the TMF760 oracle (GET is public on product-stock)
    stock-base-url: ${STOCK_BASE_URL:http://localhost:8114}
    # the fulfilment dry run launch governance asks before a launch (under the caller's token; fails soft)
    som-base-url: ${SOM_BASE_URL:http://localhost:8104}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        pim-base-url: ${PIM_BASE_URL:}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        pim-base-url: ${PIM_BASE_URL_NOVA:}
