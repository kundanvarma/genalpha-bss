spring:
  application:
    name: fulfilment
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfilment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfilment}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  events:
    topic: bss.fulfilment.events
  fulfilment:
    ordering-topic: ${FULFILMENT_ORDERING_TOPIC:bss.ordering.events}
    appointment-topic: ${FULFILMENT_APPOINTMENT_TOPIC:bss.appointment.events}
    # where the carrier posts delivery callbacks (this service, reachable in-cluster)
    carrier-callback-url: ${CARRIER_CALLBACK_URL:http://fulfilment:8080/tmf-api/shippingOrderManagement/v4/carrierEvent}
  downstream:
    ordering-base-url: ${ORDERING_BASE_URL:http://localhost:8082}
    # Logistics seam (TMF700 front): blank = off (manual warehouse flow).
    # Point at a carrier adapter to hand parcels off. Carrier name is cosmetic.
    logistics-base-url: ${LOGISTICS_BASE_URL:}
    logistics-carrier: ${LOGISTICS_CARRIER:Helthjem}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
