spring:
  application:
    name: device-entitlement
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/device_entitlement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/device_entitlement}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  events:
    topic: bss.entitlement.events
  entitlement:
    # GSMA TS.43 version this ECS speaks; the "Vers" block every response carries
    entitlement-version: "12.0"
    # how long a device may cache a configuration before asking again (seconds)
    vers-validity-seconds: ${ENTITLEMENT_VERS_VALIDITY:172800}
    # how long an issued ECS token lives (seconds) — the phone re-authenticates
    # with EAP-AKA when it lapses
    token-validity-seconds: ${ENTITLEMENT_TOKEN_VALIDITY:2592000}
    # how long an EAP-AKA relay session may stay open between challenge and answer
    eap-session-seconds: ${ENTITLEMENT_EAP_SESSION_SECONDS:120}
    # the public base URL phones reach this ECS on — used for ServiceFlow_URL
    # (the VoWiFi emergency-address websheet) and ODSA portal links
    public-base-url: ${ENTITLEMENT_PUBLIC_BASE_URL:http://localhost:8080}
    # the SM-DP+ this operator's eSIM profiles download from (activation codes)
    smdp-address: ${ENTITLEMENT_SMDP_ADDRESS:rsp.example.net}
    som-topic: ${ENTITLEMENT_SOM_TOPIC:bss.som.events}
  downstream:
    # the AUC seam: who answers "give me an authentication vector for this IMSI"
    # — the operator's HSS/UDM (or, for an MVNO, the host MNO's) behind an
    # adapter; mock-hss in dev. Blank = EAP-AKA unavailable (token-only).
    auc-base-url: ${AUC_BASE_URL:http://localhost:8157}
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-entitlement}
        machine-client-secret: ${OIDC_CLIENT_SECRET:entitlement-secret}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        token-uri: ${OIDC_TOKEN_URI_NOVA:http://localhost:8085/realms/nova/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-entitlement}
        machine-client-secret: ${OIDC_CLIENT_SECRET:entitlement-secret}
