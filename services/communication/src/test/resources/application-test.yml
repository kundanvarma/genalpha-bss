spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""


bss:
  events:
    enabled: false
  notify:
    consumer-enabled: false
    topics: none
  tenants:
    default-tenant: genalpha
    registry:
      # genalpha configures no esp-api-key on purpose: a tenant with no ESP
      # relationship must have no receipt door (see EspReceiptDoorTest).
      - id: genalpha
        issuer: https://idp.genalpha.test/realms/bss
        esp-api-key: ""
        # every operator signs its own unsubscribe links; a deployment that
        # configures none cannot send marketing mail, which is the point
        unsubscribe-secret: test-unsub-genalpha
      - id: tenant-a
        issuer: https://idp.tenant-a.test/realms/bss
        esp-api-key: test-esp-key-a
        # tenant-a has moved to a separate inbound credential
        esp-webhook-secret: test-esp-webhook-a
        unsubscribe-secret: test-unsub-a
      - id: tenant-b
        issuer: https://idp.tenant-b.test/realms/bss
        esp-api-key: test-esp-key-b
        unsubscribe-secret: test-unsub-b
