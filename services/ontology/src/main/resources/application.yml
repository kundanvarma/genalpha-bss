server:
  port: 8080

spring:
  # Jackson 3 arrived with Spring Boot 4 and flipped two defaults under us, both
  # visible on the wire: keys would come out alphabetically (@type first, then
  # a-z) on every TM Forum body, and a sparse payload that omits a primitive
  # would throw instead of reading as 0/false. Pinned back to what this
  # component's payloads and DTOs were written against.
  jackson:
    mapper:
      sort-properties-alphabetically: false
    deserialization:
      fail-on-null-for-primitives: false
  # Outbound HTTP has an end. The JDK client waits forever by default, so a
  # dependency that accepts the connection and then goes quiet holds a request
  # thread until something kills it.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
  application:
    name: ontology
  # ADR 0025. The receipt store: an action's intent is committed here before the
  # call is dispatched, so "the action ran but the evidence does not exist" stops
  # being reachable. Ontology owns this database like every other component owns
  # its own (ADR 0002); nothing else reads it.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ontology}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ontology}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 2000

management:
  # #422 tracing. Spans are made in-process always; they LEAVE only when an
  # operator names a collector: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
  # (e.g. http://otel-collector:4318/v1/traces). Unset = no exporter bean, no
  # network call, nothing fails at startup without a collector. Sampling is
  # parent-based (a calling component's traceparent decides; the gateway drops
  # one sent from outside, TraceHeaderFilter); 1.0 at the root here rather
  # than Boot's 0.1, because a ledger row or receipt carries the trace id, and a
  # join key that points at a dropped trace nine times in ten is not a key.
  # These two components see a few calls a second at most.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

# The registry: packaged from the repo's ontology/ directory; ONTOLOGY_DIR points
# at a checkout for development (edit a YAML, restart, see it). Every capability's
# route is relative to its component's base below; a component without an entry
# is reached through the gateway, which routes by path.
ontology:
  dir: ${ONTOLOGY_DIR:}
  downstream-timeout-ms: ${ONTOLOGY_DOWNSTREAM_TIMEOUT_MS:8000}
  receipt-topic: bss.ontology.events
  # A governed action must leave a receipt, so the service refuses to START when
  # it cannot write one (see ReceiptPublisher). True is the application default;
  # false is a deliberate decision to run actions that cannot be proved.
  receipts-required: ${ONTOLOGY_RECEIPTS_REQUIRED:true}
  # the declared outcome of an action is measured this long after it (90 days in life; the demo compresses it)
  outcome-after-days: ${ONTOLOGY_OUTCOME_AFTER_DAYS:90}
  outcome-sweep-ms: ${ONTOLOGY_OUTCOME_SWEEP_MS:300000}
  outcome-sweep-initial-ms: ${ONTOLOGY_OUTCOME_SWEEP_INITIAL_MS:60000}
  # The A2A server face (#426, docs/a2a.md). A partner's agent may dry-run and ask
  # for explanations; the one executing skill (pick a benefit) is OFF unless the
  # operator turns it on. The Agent Card is signed only when a key is supplied by
  # the deployment (PEM PKCS#8, EC P-256 -> ES256 or RSA -> RS256); never commit one.
  a2a:
    execute-enabled: ${ONTOLOGY_A2A_EXECUTE_ENABLED:false}
    signing-key: ${ONTOLOGY_A2A_SIGNING_KEY:}
    signing-key-id: ${ONTOLOGY_A2A_SIGNING_KEY_ID:}
  components:
    gateway: ${GATEWAY_BASE_URL:http://localhost:8080}
    # the registry's own face, for self-conformance (inside the container it listens on 8080)
    ontology: ${ONTOLOGY_SELF_URL:http://localhost:8080}
    party-account: ${PARTY_BASE_URL:}
    product-inventory: ${INVENTORY_BASE_URL:}
    product-catalog: ${CATALOG_BASE_URL:}
    product-ordering: ${ORDERING_BASE_URL:}
    service-orchestration: ${SOM_BASE_URL:}
    qualification: ${QUALIFICATION_BASE_URL:}
    agreement: ${AGREEMENT_BASE_URL:}
    policy: ${POLICY_BASE_URL:}
    device-entitlement: ${ENTITLEMENT_BASE_URL:}
    billing: ${BILLING_BASE_URL:}
    insight: ${INSIGHT_BASE_URL:}
    intelligence: ${INTELLIGENCE_BASE_URL:}
    assurance: ${ASSURANCE_BASE_URL:}

bss:
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant. The
  # machine identity is used for ONE thing: the policy pre-check (policy:evaluate).
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-ontology}
        machine-client-secret: ${OIDC_CLIENT_SECRET:ontology-secret}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        token-uri: ${OIDC_TOKEN_URI_NOVA:http://localhost:8085/realms/nova/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-ontology}
        machine-client-secret: ${OIDC_CLIENT_SECRET:ontology-secret}

# LOG INJECTION, CLOSED AT THE SINK. A CR or LF inside a logged VALUE forges a
# log line, and the fleet ships logs to Loki/Grafana where a forged line is a
# forged record someone may later read as evidence. Stripping it here rather
# than at each call site means a new log statement cannot reopen the hole by
# forgetting a helper. Only %m is wrapped: stack traces need their newlines,
# and those are ours, not the caller's.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} : %replace(%m){'[\\r\\n]+', ' '}%n%wEx"
