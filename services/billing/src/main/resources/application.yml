spring:
  application:
    name: billing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/billing}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  downstream:
    inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8083}
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8081}
    payment-base-url: ${PAYMENT_BASE_URL:http://localhost:8087}
    usage-base-url: ${USAGE_BASE_URL:http://localhost:8097}
    promotion-base-url: ${PROMOTION_BASE_URL:http://localhost:8099}
    policy-base-url: ${POLICY_BASE_URL:http://localhost:8113}
    party-base-url: ${PARTY_BASE_URL:http://localhost:8084}
    som-base-url: ${SOM_BASE_URL:http://localhost:8104}
    # the country rails (Norway reference: eFaktura-style e-invoice alias/RFP,
    # Digipost-style mailbox, AvtaleGiro-style direct debit) — adapters behind
    # generic ports, mocks in dev, per-tenant agreements in production
    einvoice-rail-base-url: ${EINVOICE_RAIL_BASE_URL:http://localhost:8147}
    mailbox-rail-base-url: ${MAILBOX_RAIL_BASE_URL:http://localhost:8148}
    directdebit-rail-base-url: ${DIRECTDEBIT_RAIL_BASE_URL:http://localhost:8149}
  collections:
    # TEST HARNESS ONLY, never production: statutory/policy day-spans count
    # in SECONDS instead of days so a proof run lives a delinquency in
    # minutes. The statutory numbers themselves never change.
    compress-clocks: ${BSS_COLLECTIONS_COMPRESS_CLOCKS:false}
  billing:
    collections-tick-ms: ${BSS_COLLECTIONS_TICK_MS:60000}
  events:
    topic: bss.billing.events
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-billing}
        machine-client-secret: ${OIDC_CLIENT_SECRET:billing-secret}
        bill-distribution-provider: ${BILL_DISTRIBUTION_PROVIDER:none}
        bill-distribution-url: ${BILL_DISTRIBUTION_URL:}
        bill-distribution-token: ${BILL_DISTRIBUTION_TOKEN:}
        bill-distribution-format: ${BILL_DISTRIBUTION_FORMAT:peppol}
        bill-distribution-channel: ${BILL_DISTRIBUTION_CHANNEL:einvoice}
        bank-token: ${BANK_TOKEN:}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        token-uri: ${OIDC_TOKEN_URI_NOVA:http://localhost:8085/realms/nova/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-billing}
        machine-client-secret: ${OIDC_CLIENT_SECRET:billing-secret}
        bill-distribution-provider: ${BILL_DISTRIBUTION_PROVIDER_NOVA:none}
        bill-distribution-url: ${BILL_DISTRIBUTION_URL_NOVA:}
        bill-distribution-token: ${BILL_DISTRIBUTION_TOKEN_NOVA:}
        bill-distribution-format: ${BILL_DISTRIBUTION_FORMAT_NOVA:ehf}
        bill-distribution-channel: ${BILL_DISTRIBUTION_CHANNEL_NOVA:einvoice}
        bank-token: ${BANK_TOKEN_NOVA:}
