spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""


bss:
  billing:
    # The periodic sweeps do not run under test. They fire once at context start
    # otherwise, and that tick calls the same @MockBean TenantClock the tests are
    # stubbing — which is how clock.today() came back null in the reactor-wide run
    # and nowhere else (#140). Tests invoke sweepTenant() directly.
    sweep-initial-delay-ms: 86400000
    collections-tick-ms: 86400000
    dunning-tick-ms: 86400000
    distribution-tick-ms: 86400000
    shadow-tick-ms: 86400000
  events:
    enabled: false
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: https://idp.genalpha.test/realms/bss
      - id: tenant-a
        issuer: https://idp.tenant-a.test/realms/bss
        # the credential the distribution partner presents on
        # POST /distribution/v1/response — one per relationship
        bill-distribution-token: test-dist-token-a
      - id: tenant-b
        issuer: https://idp.tenant-b.test/realms/bss
        bill-distribution-token: test-dist-token-b
