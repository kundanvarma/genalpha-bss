spring:
  # Outbound HTTP has an end. The JDK client waits forever by default, so a
  # dependency that accepts the connection and then goes quiet holds a request
  # thread until something kills it.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
  application:
    name: bss-bridge
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 2000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
