spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""


bss:
  events:
    enabled: false
  tenants:
    default-tenant: genalpha
    registry:
      # ocs-notify-secret: the credential on the northbound OCS door. Distinct
      # per tenant on purpose — the door believes the tenant a body names only
      # because the body verifies against THAT tenant's secret.
      - id: genalpha
        issuer: https://idp.genalpha.test/realms/bss
        ocs-notify-secret: test-ocs-secret-genalpha
      - id: tenant-a
        issuer: https://idp.tenant-a.test/realms/bss
        ocs-notify-secret: test-ocs-secret-tenant-a
      - id: tenant-b
        issuer: https://idp.tenant-b.test/realms/bss
        ocs-notify-secret: test-ocs-secret-tenant-b
      # a registered tenant whose door is deliberately shut (no secret)
      - id: tenant-c
        issuer: https://idp.tenant-c.test/realms/bss
