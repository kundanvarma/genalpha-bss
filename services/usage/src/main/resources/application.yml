spring:
  application:
    name: usage
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usage}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  usage:
    # closed-loop late-CDR re-rating: sweep cadence + how far back a period
    # may still auto-move (older = a dispute, not a silent mutation)
    wholesale-rerate-tick-ms: ${WHOLESALE_RERATE_TICK_MS:300000}
    wholesale-rerate-window-days: ${WHOLESALE_RERATE_WINDOW_DAYS:45}
    policy:
      # Country pack (Norway defaults): the statutory floor on the lowest
      # selectable content-services cap and the default roaming financial
      # limit (EU 2022/612 ≈ €50 ex VAT). Deployment-overridable — policy
      # writes can never undercut the floor.
      country: ${USAGE_POLICY_COUNTRY:NO}
      content-cap-floor: ${CONTENT_CAP_FLOOR:250}
      content-cap-currency: ${CONTENT_CAP_CURRENCY:NOK}
      roaming-default-limit: ${ROAMING_DEFAULT_LIMIT:50}
      roaming-default-currency: ${ROAMING_DEFAULT_CURRENCY:EUR}
      # ZoneEnteredEvent dedup: first record from a zone within this window
      zone-entry-window-days: ${ZONE_ENTRY_WINDOW_DAYS:30}
  events:
    topic: bss.usage.events
  ocs:
    # where a SigScale OCS balance hub reaches THIS service (its callback door)
    notify-base-url: ${OCS_NOTIFY_BASE_URL:http://localhost:8080}
    # the OCS's own "running low" line in bytes — the same number the
    # SigScale container runs with (OCS_THRESHOLD_BYTES); default 2 GB
    sigscale-threshold-bytes: ${OCS_THRESHOLD_BYTES:2000000000}
  downstream:
    ocs-base-url: ${OCS_BASE_URL:}
    # which adapter speaks to that OCS: http (the generic subscriber/bucket
    # REST shape — mock-ocs in dev, a vendor gateway in production) or
    # sigscale (SigScale OCS over its TM Forum APIs). A tenant may override
    # all four in tenants.yml (ocs-provider / ocs-base-url / ocs-username /
    # ocs-password) — one fleet, one OCS per operator.
    ocs-provider: ${OCS_PROVIDER:http}
    ocs-username: ${OCS_USERNAME:}
    ocs-password: ${OCS_PASSWORD:}
    # The gift boundary — household links are verified here live.
    party-base-url: ${PARTY_BASE_URL:http://localhost:8084}
    # Product levers (giftable/giftScope/rollover*) live on the plan's spec.
    catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8081}
    # Operator vetoes: gifting rules authored as data (domain 'gifting').
    policy-base-url: ${POLICY_BASE_URL:http://localhost:8113}
    # Gift by phone number: the SOM's number pool knows who holds every MSISDN.
    som-base-url: ${SOM_BASE_URL:http://localhost:8104}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-usage}
        machine-client-secret: ${OIDC_CLIENT_SECRET:usage-secret}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        token-uri: ${OIDC_TOKEN_URI_NOVA:http://localhost:8085/realms/nova/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-usage}
        machine-client-secret: ${OIDC_CLIENT_SECRET:usage-secret}
