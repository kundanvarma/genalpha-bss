spring:
  application:
    name: party-account
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/party_account}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/party_account}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  events:
    topic: bss.party.events
  # National-registry re-sync seam (Norway rails, P1). freg-shaped wire —
  # mock-freg in dev; a real deployment changes base-url + the credential env
  # var (named by secret-ref), config only. The worker polls the registry
  # event feed per tenant; disable with sync-enabled=false.
  registry:
    base-url: ${REGISTRY_BASE_URL:http://localhost:8141}
    secret-ref: ${REGISTRY_SECRET_REF:FREG_API_KEY}
    country: ${REGISTRY_COUNTRY:NO}
    provider: ${REGISTRY_PROVIDER:freg}
    sync-enabled: ${REGISTRY_SYNC_ENABLED:true}
    sync-interval-ms: ${REGISTRY_SYNC_INTERVAL_MS:30000}
  # Directory obligation: the scheduled delta export is OFF until a tenant
  # has a directory-partner agreement; the POST /directoryExport/run trigger
  # serves demos and tests either way.
  directory:
    export-enabled: ${DIRECTORY_EXPORT_ENABLED:false}
    export-cron: ${DIRECTORY_EXPORT_CRON:0 0 4 * * *}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
