spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""


bss:
  events:
    enabled: false
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: https://idp.genalpha.test/realms/bss
        choices: true
        choices-label: Choices
      - id: tenant-a
        issuer: https://idp.tenant-a.test/realms/bss
        # a Norwegian operator offering Choices: holds are 0 there by law-as-data (#357)
        choices: true
        country: "NO"
      - id: tenant-b
        issuer: https://idp.tenant-b.test/realms/bss
