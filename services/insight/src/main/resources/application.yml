spring:
  # Jackson 3 arrived with Spring Boot 4 and flipped two defaults under us, both
  # visible on the wire: keys would come out alphabetically (@type first, then
  # a-z) on every TM Forum body, and a sparse payload that omits a primitive
  # would throw instead of reading as 0/false. Pinned back to what this
  # component's payloads and DTOs were written against.
  jackson:
    mapper:
      sort-properties-alphabetically: false
    deserialization:
      fail-on-null-for-primitives: false
  # Outbound HTTP has an end. The JDK client waits forever by default, so a
  # dependency that accepts the connection and then goes quiet holds a request
  # thread until something kills it.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
  application:
    name: insight
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insight}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/insight}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  events:
    topic: bss.insight.events
  insight:
    # THE DECISION LOG'S SOURCES, GOVERNED ACTIONS INCLUDED.
    # insight's decision_log IS the durable store for every decision the BSS
    # makes, receipts included: the ontology publishes each executed action as a
    # DecisionRecordedEvent in exactly this shape and DecisionLogListener
    # persists it. The store is real and populated — 3,603 ontology-sourced rows
    # on the demo box when this was checked.
    #
    # The list used to default to campaign + intelligence only, with
    # bss.ontology.events added in docker-compose.yml. Compose is the right home
    # for a DEMO opt-in; this is not one. A production deployment on application
    # defaults would have persisted no governed-action receipt at all, and
    # nothing would have said so — the same shape as #233, where evidence could
    # silently not exist. The application default now carries it; compose may
    # still override.
    decision-topics: ${BSS_INSIGHT_DECISION_TOPICS:bss.campaign.events,bss.intelligence.events,bss.ontology.events}
    # Auto-refresh scheduler for materialized audiences — bounded + controllable.
    refresh:
      enabled: ${INSIGHT_REFRESH_ENABLED:true}
      interval-ms: ${INSIGHT_REFRESH_INTERVAL_MS:300000}
      max-per-run: ${INSIGHT_REFRESH_MAX_PER_RUN:25}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  downstream:
    # experience rules authored as data live in the policy component
    policy-base-url: ${POLICY_BASE_URL:http://localhost:8113}
    # the ESP suppression list — filtered out before an ad-platform export
    communication-base-url: ${COMMUNICATION_BASE_URL:}
    # acquisition seams: push audiences OUT as ad/social Custom Audiences (hashed).
    # Meta shape:
    social-api-url: ${SOCIAL_API_URL:}
    social-access-token: ${SOCIAL_ACCESS_TOKEN:}
    # Google Customer Match shape (a second destination through one connector):
    google-api-url: ${GOOGLE_API_URL:}
    google-access-token: ${GOOGLE_ACCESS_TOKEN:}
    # social listening: the brand's own handle to pull mentions for
    social-account-id: ${SOCIAL_ACCOUNT_ID:}
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-insight}
        machine-client-secret: ${OIDC_CLIENT_SECRET:insight-secret}
        analytics-provider: ${ANALYTICS_PROVIDER:internal}
        analytics-mp-url: ${ANALYTICS_MP_URL:https://www.google-analytics.com}
        analytics-measurement-id: ${ANALYTICS_MEASUREMENT_ID:}
        analytics-api-secret: ${ANALYTICS_API_SECRET:}
        analytics-data-url: ${ANALYTICS_DATA_URL:}
        analytics-property-id: ${ANALYTICS_PROPERTY_ID:}
        analytics-data-token: ${ANALYTICS_DATA_TOKEN:}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        token-uri: ${OIDC_TOKEN_URI_NOVA:http://localhost:8085/realms/nova/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-insight}
        machine-client-secret: ${OIDC_CLIENT_SECRET:insight-secret}
        analytics-provider: ${ANALYTICS_PROVIDER_NOVA:internal}
        analytics-mp-url: ${ANALYTICS_MP_URL_NOVA:https://www.google-analytics.com}
        analytics-measurement-id: ${ANALYTICS_MEASUREMENT_ID_NOVA:}
        analytics-api-secret: ${ANALYTICS_API_SECRET_NOVA:}
        analytics-data-url: ${ANALYTICS_DATA_URL_NOVA:}
        analytics-property-id: ${ANALYTICS_PROPERTY_ID_NOVA:}
        analytics-data-token: ${ANALYTICS_DATA_TOKEN_NOVA:}
