spring:
  application:
    name: base-migration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/base_migration}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      properties:
        max.block.ms: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    # Complete standalone connection: migrations run as the OWNING role
    # (RLS does not bind owners), never through the tenant-aware wrapper.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/base_migration}
    user: ${DB_MIGRATION_USERNAME:${DB_USERNAME:postgres}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:postgres}}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bss:
  events:
    topic: bss.migration.events
  migration:
    # Execution loop cadence: notices and (gated) modify orders per tick.
    tick-ms: ${MIGRATION_TICK_MS:5000}
    # EECC Art. 105 / ekomloven: written notice at least one month before a
    # contract change takes effect. Plans may not set noticeDays below this
    # floor unless compress-clocks is on (tests/demo ONLY — a compressed
    # clock in production is a regulatory violation, not a convenience).
    notice-floor-days: ${MIGRATION_NOTICE_FLOOR_DAYS:30}
    compress-clocks: ${MIGRATION_COMPRESS_CLOCKS:false}
    # Daily birthday / promo-expiry scan (also runnable per plan on demand
    # via POST /migrationPlan/{id}/scanTriggers).
    trigger-scan-cron: ${MIGRATION_TRIGGER_SCAN_CRON:0 0 5 * * *}
  downstream:
    inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8083}
    ordering-base-url: ${ORDERING_BASE_URL:http://localhost:8082}
    agreement-base-url: ${AGREEMENT_BASE_URL:http://localhost:8098}
    party-base-url: ${PARTY_BASE_URL:http://localhost:8084}
    intelligence-base-url: ${INTELLIGENCE_BASE_URL:http://localhost:8109}
  # Issuer-per-tenant: each entry is a trusted OIDC issuer that IS a tenant.
  # jwks-uri is the backchannel key endpoint (dev: keycloak's split hostname);
  # leave it empty when the issuer is directly reachable for discovery.
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: ${OIDC_ISSUER_URI:http://localhost:8085/realms/bss}
        jwks-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:}
        token-uri: ${OIDC_TOKEN_URI:http://localhost:8085/realms/bss/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-base-migration}
        machine-client-secret: ${OIDC_CLIENT_SECRET:base-migration-secret}
      - id: nova
        issuer: ${OIDC_ISSUER_URI_NOVA:http://localhost:8085/realms/nova}
        jwks-uri: ${OIDC_JWKS_URI_NOVA:}
        token-uri: ${OIDC_TOKEN_URI_NOVA:http://localhost:8085/realms/nova/protocol/openid-connect/token}
        machine-client-id: ${OIDC_CLIENT_ID:bss-base-migration}
        machine-client-secret: ${OIDC_CLIENT_SECRET:base-migration-secret}
