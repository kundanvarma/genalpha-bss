spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-{vendor}
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    user: sa
    password: ""


bss:
  events:
    enabled: false
  migration:
    # tests drive the engine by hand; the scheduled tick stays out of the way
    tick-ms: 3600000
    trigger-scan-cron: "-"
    # the notice gate is proven with a FAKE clock, not a compressed law:
    # compress-clocks only lifts the plan-creation floor so short windows
    # are creatable at all
    compress-clocks: true
    notice-floor-days: 30
  tenants:
    default-tenant: genalpha
    registry:
      - id: genalpha
        issuer: https://idp.genalpha.test/realms/bss
      - id: tenant-a
        issuer: https://idp.tenant-a.test/realms/bss
      - id: tenant-b
        issuer: https://idp.tenant-b.test/realms/bss
