server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Hashed bundles are immutable; index.html must always revalidate or
    # browsers keep serving a stale app after deploys.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HONEST HTTP (#180). `try_files $uri /index.html` for everything answered
    # 200 with the app shell for ANY path. /shop/nonsense looked exactly like a
    # real page to a crawler, a link checker and a monitor — because it WAS a
    # real page: the shell, which then rendered nothing. A 200 on a URL that
    # does not exist is the most expensive kind of wrong, because nothing
    # downstream can detect it.
    #
    # The gateway strips the /shop prefix, so these are the app's own paths.
    # They are enumerated here rather than inferred, and that duplicates the
    # router in App.jsx. The duplication is deliberate and temporary: the
    # alternative is this file claiming every URL is valid. When server-side
    # rendering lands, the router answers this question for real and the two
    # location blocks below are deleted, not maintained.

    # the shop root
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # pages with no parameter
    location ~ ^/(shop|cart|orders|bills|services|devices|notifications|support|account|family)/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # pages that REQUIRE an identifier — /offering with no id is not a page
    location ~ ^/(offering|family)/[^/]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # anything else: a real file if one exists, otherwise an honest 404
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
