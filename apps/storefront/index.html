<!doctype html>
<!-- One build serves every operator, so the document's LANGUAGE cannot be a
     literal here: it used to say lang="en" to Norwegian and Danish tenants
     alike. tenant-config.js is generated per hostname by the gateway and sets
     <html lang> from that tenant's configured locale — which is why it loads
     in <head>, before there is any content to read in the wrong language. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0E7C7B">
  <link rel="manifest" href="/shop/manifest.webmanifest">
  <link rel="icon" href="/shop/icon.svg" type="image/svg+xml">
  <title>GenAlpha — shop</title>
  <!-- Which tenant's IdP this host logs in against, and which language it sells in. -->
  <script src="/shop/tenant-config.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
