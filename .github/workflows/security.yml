name: Security
# Static analysis, dependency review, the architecture ratchet and the secret
# gate — the checks the agent must pass, not prose it must remember
# (docs/engineering-conventions.md).
#
# Actions are pinned to commit SHAs. A tag is a mutable pointer in somebody
# else's repository, and these jobs hold security-events: write.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/autobuild@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  architecture-ratchet:
    name: Architecture ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ops/arch/ratchet.sh

  secret-gate:
    name: Secret gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The pre-commit hook runs this on the staged diff, but a hook only
      # protects a clone that installed it. The same gate over the whole
      # working tree is what protects the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ops/scan-secrets.sh --all

  claims-gate:
    name: Claims gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The ratchet counts code debt. This counts the distance between what
      # the documents claim and what the code does — suite counts, stack
      # versions, secure-by-default settings, and whether every gate we call
      # a gate can actually fail. An outside review found five of these at
      # once; none was a bug, and together they cost more than a bug.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ops/arch/claims.sh

  deploy-validation:
    name: Deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The README said the Helm chart had run on live k3s/EKS/AKS but was
      # "not template-verified", and no workflow rendered it or touched
      # Terraform. So the chart and the stacks could break and the only
      # discovery would be an operator's failed install. These are STATIC
      # checks: no cluster, no cloud account, no credentials, ~1 minute.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.3
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Helm lint
        run: helm lint deploy/helm/genalpha-bss

      # Render with BOTH value sets: the soak values are a real deployment
      # shape and a template can be valid for one and broken for the other.
      - name: Helm template renders
        run: |
          set -euo pipefail
          helm template bss deploy/helm/genalpha-bss > /tmp/default.yaml
          helm template bss deploy/helm/genalpha-bss \
            -f deploy/helm/genalpha-bss/values-soak.yaml > /tmp/soak.yaml
          wc -l /tmp/default.yaml /tmp/soak.yaml

      # Rendering is not validity: a manifest can render and still name a field
      # Kubernetes has never had. kubeconform checks it against the real schema
      # for the version deploy/terraform/aws/variables.tf actually targets.
      - name: Kubernetes schema validation
        run: |
          set -euo pipefail
          # read the whole variable block, not a fixed window: comments sit
          # between `type` and `default`, and an -A3 grep silently returned
          # empty (caught by dry-running this job before committing it)
          KV=$(sed -n '/variable "kubernetes_version"/,/^}/p' \
               deploy/terraform/aws/variables.tf \
               | grep -oE 'default *= *"[0-9]+\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+')
          [ -n "$KV" ] || { echo "could not read kubernetes_version from variables.tf" >&2; exit 1; }
          echo "validating against Kubernetes ${KV}.0 (from variables.tf)"
          curl -fsSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /tmp kubeconform
          for f in /tmp/default.yaml /tmp/soak.yaml; do
            echo "::group::$f"
            /tmp/kubeconform -strict -summary -kubernetes-version "${KV}.0" < "$f"
            echo "::endgroup::"
          done

      - name: Terraform formatted and valid
        run: |
          set -euo pipefail
          terraform fmt -check -recursive deploy/terraform
          for stack in deploy/terraform/*/; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false -no-color
            terraform -chdir="$stack" validate -no-color
            echo "::endgroup::"
          done
