name: CI

# Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer in
# somebody else's repository, and this workflow has a checkout of our source
# and a Maven cache to hand.
#
# Coverage: every module, every test. This used to be five services of
# forty-two, which meant a green tick said very little -- the ordering mock
# drift and the duplicate migration version that broke the fleet both sat in
# modules CI never compiled.
#
# The 29 Testcontainers tests (the only ones that meet real Postgres) run here
# too. They had never executed anywhere, because they skip when Docker is
# absent and a laptop's Colima is not reachable to them. A local proof run
# with Docker spelled out found what they had been hiding: twelve stale
# migration counts, a request that predated a mandatory field, and a set of
# tests copy-pasted into the wrong component. Those are fixed; this is the
# check that stops them going stale again.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run proves nothing; cancel it and keep the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Every module, every test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # One reactor: shared modules compile once, and every module's tests run.
      # A runner has native Docker, so the Testcontainers tests need none of
      # the coaxing a laptop does (see CLAUDE.md).
      - name: Build and test
        run: mvn -B verify

  images:
    name: Every service image builds
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 90
    # On a push to main this job also PUBLISHES: every image goes to GHCR under
    # its source SHA, signed keyless with cosign (Sigstore, the runner's OIDC
    # identity) and attested with build provenance. A pull request only builds
    # and scans — it has no id-token, so nothing can be signed from a PR.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The images copy a HOST-built jar, so the jars have to exist first.
      # Tests already ran in the job above; this one proves the Dockerfiles.
      - name: Package the jars
        run: mvn -B -T 1C package -DskipTests
      - name: Build each image
        run: |
          set -euo pipefail
          failed=""
          for dir in services/*/; do
            svc="$(basename "$dir")"
            [ -f "$dir/Dockerfile" ] || continue
            echo "::group::$svc"
            if ! docker build -q -t "bss/$svc:${{ github.sha }}" "$dir"; then
              failed="$failed $svc"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "images failed to build:$failed"
            exit 1
          fi
      # SUPPLY-CHAIN EVIDENCE (TAR-18): every built image gets a CycloneDX SBOM
      # and a vulnerability scan of its final filesystem — OS packages and the
      # base image included, which Java dependency review never sees. The
      # artifacts are the release's evidence, keyed by the source SHA. The scan
      # is REPORT-ONLY for now (exit-code 0): the policy that turns a severity
      # into a red build is set once the first reports have been read, not
      # guessed — a gate that fires on day one on the base image's backlog
      # gets disabled by lunchtime.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      - name: SBOM and scan each image
        run: |
          set -uo pipefail
          mkdir -p sboms scans
          {
            echo "## Image supply-chain evidence for ${{ github.sha }}"
            echo
            echo "| image | SBOM components | CRITICAL | HIGH |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in services/*/; do
            svc="$(basename "$dir")"
            [ -f "$dir/Dockerfile" ] || continue
            img="bss/$svc:${{ github.sha }}"
            syft "$img" -o cyclonedx-json > "sboms/$svc.cdx.json" 2>/dev/null || echo "{}" > "sboms/$svc.cdx.json"
            n=$(python3 -c "import json; print(len(json.load(open('sboms/$svc.cdx.json')).get('components', [])))")
            trivy image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
              --format json --output "scans/$svc.json" "$img" >/dev/null 2>&1 || echo '{"Results":[]}' > "scans/$svc.json"
            c=$(python3 -c "import json; r=json.load(open('scans/$svc.json')); v=[x for res in r.get('Results',[]) for x in (res.get('Vulnerabilities') or [])]; print(sum(1 for x in v if x['Severity']=='CRITICAL'))")
            h=$(python3 -c "import json; r=json.load(open('scans/$svc.json')); v=[x for res in r.get('Results',[]) for x in (res.get('Vulnerabilities') or [])]; print(sum(1 for x in v if x['Severity']=='HIGH'))")
            echo "| $svc | $n | $c | $h |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sboms-${{ github.sha }}
          path: sboms/
          retention-days: 90
      - name: Upload image scans
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-scans-${{ github.sha }}
          path: scans/
          retention-days: 90

      # IMMUTABLE RELEASE ARTIFACTS (TAR-10/18, docs/production-acceptance.md §4):
      # tag = the source SHA (never `latest`; the chart refuses `latest` in
      # production), digest recorded, SBOM attached as a cosign attestation,
      # signature keyless, provenance from GitHub's attestation store. Verify:
      #   cosign verify ghcr.io/<owner>/genalpha-bss/<svc>@<digest> \
      #     --certificate-identity-regexp 'github.com/<owner>/genalpha-bss' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/<owner>/genalpha-bss/<svc>@<digest> -R <owner>/genalpha-bss
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Publish, sign and attach the SBOM to each image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          : > image-digests.txt
          {
            echo; echo "## Published images for ${{ github.sha }}"; echo
            echo "| image | digest |"; echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for dir in services/*/; do
            svc="$(basename "$dir")"
            [ -f "$dir/Dockerfile" ] || continue
            ref="ghcr.io/$owner/genalpha-bss/$svc"
            docker tag "bss/$svc:${{ github.sha }}" "$ref:${{ github.sha }}"
            docker push -q "$ref:${{ github.sha }}"
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$ref:${{ github.sha }}" | cut -d@ -f2)"
            cosign sign --yes "$ref@$digest"
            cosign attest --yes --type cyclonedx --predicate "sboms/$svc.cdx.json" "$ref@$digest"
            echo "${digest#sha256:}  $ref" >> image-digests.txt
            echo "| $ref | $digest |" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Attest build provenance for every published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: image-digests.txt
      - name: Keep the digest list
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digests-${{ github.sha }}
          path: image-digests.txt
          retention-days: 400
