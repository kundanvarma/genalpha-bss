name: CI

# Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer in
# somebody else's repository, and this workflow has a checkout of our source
# and a Maven cache to hand.
#
# Coverage: every module is COMPILED and PACKAGED here, and every image is
# built. Tests still run for five services only. That is the remaining gap and
# it is a real one -- the ordering mock drift and the duplicate migration
# version that broke the fleet both sat in modules whose tests CI never ran.
# Turning on `mvn verify` for the whole reactor needs one local proof run
# first, because several modules carry Testcontainers tests that have never
# executed anywhere: they skip when Docker is absent, and a CI runner has
# Docker. Switching the step without that proof would just paint CI red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run proves nothing; cancel it and keep the minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tested:
    name: ${{ matrix.service }} (build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - product-catalog
          - product-ordering
          - product-inventory
          - party-account
          - gateway
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify -pl services/${{ matrix.service }} -am

  everything-builds:
    name: Every module packages, every image builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # One reactor: shared modules compile once. This is what catches a module
      # that no longer compiles, or two migrations sharing a version -- neither
      # of which the five-service matrix could ever see.
      - name: Package every module
        run: mvn -B -T 1C package -DskipTests
      # The images copy a HOST-built jar, so the jars have to exist first.
      - name: Build each image
        run: |
          set -euo pipefail
          failed=""
          for dir in services/*/; do
            svc="$(basename "$dir")"
            [ -f "$dir/Dockerfile" ] || continue
            echo "::group::$svc"
            if ! docker build -q -t "bss/$svc:${{ github.sha }}" "$dir"; then
              failed="$failed $svc"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "images failed to build:$failed"
            exit 1
          fi
